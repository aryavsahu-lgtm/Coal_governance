<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#075985" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <filter id="shieldShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- Outer Hexagonal / Shield Base -->
  <path d="M50 6 L86 22 L86 54 C86 74 50 94 50 94 C50 94 14 74 14 54 L14 22 Z" fill="url(#shieldGrad)" stroke="#38bdf8" stroke-width="2" filter="url(#shieldShadow)"/>
  <!-- Inner Rim -->
  <path d="M50 12 L80 26 L80 52 C80 69 50 86 50 86 C50 86 20 69 20 52 L20 26 Z" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="1.5"/>
  <!-- Coal strata lines / layers -->
  <path d="M30 45 L70 45" stroke="rgba(255,255,255,0.3)" stroke-width="2" stroke-linecap="round"/>
  <path d="M26 55 L74 55" stroke="rgba(255,255,255,0.3)" stroke-width="2" stroke-linecap="round"/>
  <!-- Central Mining Pick & Hammer with Checkmark -->
  <g transform="translate(50, 48)">
    <!-- Central Safety Cross / Checkmark in Gold -->
    <circle cx="0" cy="0" r="18" fill="#ffffff" opacity="0.95"/>
    <path d="M-8 0 L-2 7 L10 -5" fill="none" stroke="#0284c7" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- Star on top -->
  <polygon points="50,15 52,20 57,20 53,23 55,28 50,25 45,28 47,23 43,20 48,20" fill="url(#goldGrad)"/>
</svg>
